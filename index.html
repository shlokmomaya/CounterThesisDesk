<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Counter-Thesis Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: a research workstation. A narrow workspace rail on the left lists the reviews; the right side is one review, read top to bottom:
   verdict, disagreements, evidence, numbers, audit trail. Hierarchy comes from type, rules and alignment; boxes are used sparingly. */
:root{
  --bg:#f7f6f3; --surface:#ffffff; --ink:#191b1f; --ink2:#454a54; --muted:#757b86; --rule:#dcdcd6; --rule2:#191b1f; --sunk:#eeede8;
  --accent:#1d4a85; --accent-bg:#e6edf6; --good:#1b7046; --bad:#ae332b; --warn:#8a5a08; --neutral:#555b66;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --hist:#b4b8bf;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"IBM Plex Serif",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121315; --surface:#1a1c1f; --ink:#e8e9eb; --ink2:#b3b7be; --muted:#858a93; --rule:#2d3035; --rule2:#e8e9eb; --sunk:#212327;
  --accent:#86b3ee; --accent-bg:#1b2a3d; --good:#5bc191; --bad:#ee7d74; --warn:#dca947; --neutral:#a0a6b0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hist:#565a62; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1a1c1f; --ink:#e8e9eb; --ink2:#b3b7be; --muted:#858a93; --rule:#2d3035; --rule2:#e8e9eb; --sunk:#212327;
  --accent:#86b3ee; --accent-bg:#1b2a3d; --good:#5bc191; --bad:#ee7d74; --warn:#dca947; --neutral:#a0a6b0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hist:#565a62; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
h2{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:12.5px}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--rule);padding:16px 14px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:901px){.rail{position:sticky;top:0;height:100vh;overflow-y:auto}}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--rule)}}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.navgroup{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:none;border:0;border-radius:4px;padding:6px 8px;text-align:left;cursor:pointer;color:var(--ink2);width:100%}
.nav:hover{background:var(--sunk)}
.nav[aria-current="true"]{background:var(--accent-bg);color:var(--ink);font-weight:600}
.nav .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .s{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nav.rep{flex-direction:column;align-items:stretch;gap:0;padding:7px 8px}
.nav.rep .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nav.rep .m{font-size:12px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn.q{background:none;color:var(--ink2);border:1px solid var(--rule);font-weight:500}
.btn.q:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.railfoot{margin-top:auto;font-size:12px;color:var(--muted)}

main{padding-inline:28px;padding-block:22px 72px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1120px}
@media (max-width:900px){main{padding-inline:16px}}
.head{display:flex;flex-direction:column;gap:6px}
nav.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule2)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:7px 14px 6px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.view{display:flex;flex-direction:column;gap:26px}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk>h2{border-top:1px solid var(--rule);padding-top:12px}
.blk.first>h2{border-top:0;padding-top:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px 32px}
.prose{max-width:80ch;color:var(--ink2)}
.verdict{font-family:var(--serif);font-size:22px;line-height:1.25;font-weight:500;text-wrap:balance}
.counter{font-size:16px;max-width:82ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule)}
.figs>div{padding:10px 14px 10px 0;display:flex;flex-direction:column;gap:1px;min-width:0}
.figs b{font-family:var(--mono);font-size:20px;font-weight:500}
.figs .s{font-size:12px;color:var(--muted)}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 28px}
.axis{display:flex;flex-direction:column;gap:3px}
.axis .q{font-size:12px;color:var(--muted)}
.axis .a{font-weight:600}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:5px 10px 5px 0;border-bottom:1px solid var(--rule2);vertical-align:bottom;white-space:nowrap}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.r,th.r{text-align:right;padding-right:0;padding-left:10px}
tr.tot td{border-top:1px solid var(--rule2);border-bottom:0;font-weight:600}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--accent-bg)}
.scroll{overflow-x:auto}
td.k{color:var(--muted);white-space:nowrap}
.tag{font-weight:600;white-space:nowrap}
.tag::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;background:currentColor;border-radius:50%;vertical-align:1px}
.tag.good{color:var(--good)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.neutral{color:var(--neutral)}
.tag.bad::before{border-radius:0} .tag.warn::before{border-radius:0;transform:rotate(45deg)} .tag.neutral::before{background:none;border:1.5px solid currentColor}
.pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;white-space:nowrap}
.mat4{color:var(--ink);border-color:var(--ink)}

/* disagreements */
.dis{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.dis .n{font-family:var(--mono);color:var(--muted)}
.dis dl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:2px 10px;margin:4px 0 0}
.dis dt{color:var(--muted);font-size:12.5px} .dis dd{margin:0}

/* ledger */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipb{font-size:12.5px;background:none;color:var(--ink2);border:1px solid var(--rule);border-radius:3px;padding:3px 9px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel,input.txt,textarea.txt{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 8px}
details.claim{border-bottom:1px solid var(--rule)}
details.claim summary{list-style:none;cursor:pointer;padding:9px 0;display:grid;grid-template-columns:160px minmax(0,1fr) 84px 70px 76px;gap:4px 14px;align-items:baseline}
details.claim summary::-webkit-details-marker{display:none}
details.claim summary:hover{background:var(--sunk)}
details.claim .body{padding:2px 0 14px 174px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px}
details.claim .body dt{color:var(--muted);font-size:12.5px} details.claim .body dd{margin:0;color:var(--ink2)}
@media (max-width:760px){details.claim summary{grid-template-columns:1fr 1fr}details.claim summary .q{grid-column:1/-1}details.claim .body{padding-left:0;grid-template-columns:1fr}}
.ledhead{display:grid;grid-template-columns:160px minmax(0,1fr) 84px 70px 76px;gap:14px;border-bottom:1px solid var(--rule2);padding-bottom:5px}
@media (max-width:760px){.ledhead{display:none}}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:6px 9px;border-radius:3px;overflow-x:auto;white-space:nowrap;color:var(--ink2)}

/* controls */
details.more>summary{cursor:pointer;font-weight:600;padding:8px 0;border-top:1px solid var(--rule);list-style-position:inside}
details.more[open]>summary{margin-bottom:8px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 22px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink2)}
.ctl .row{display:flex;justify-content:space-between;gap:8px}
.ctl output{font-family:var(--mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
input.w{width:58px;text-align:right;font-family:var(--mono);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--rule);padding:5px 14px;cursor:pointer;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.heat td{text-align:right;font-family:var(--mono)}
.heat td.selc{outline:2px solid var(--ink);outline-offset:-2px}

/* new review */
.drop{display:flex;flex-direction:column;gap:3px;border:1.5px dashed var(--accent);border-radius:5px;padding:18px;cursor:pointer;background:var(--surface)}
.drop.over{background:var(--accent-bg)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule)}
.steps li i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.steps li.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done i{background:var(--good);border-color:var(--good)} .steps li.skip i{background:var(--warn);border-color:var(--warn)} .steps li.fail i{background:var(--bad);border-color:var(--bad)}
.steps small{display:block;color:var(--muted);overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.run i{animation:none}}
.notice{border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.notice.err{border-left-color:var(--bad)}
td.r+td:not(.r),th.r+th:not(.r){padding-left:20px}
details.claim .body,details.claim .body dd,.dis dd{min-width:0;overflow-wrap:anywhere}
.formula{overflow-x:auto;max-width:100%}
.empty{padding:26px 0;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty b{color:var(--ink);font-size:15px}
svg text{font-family:var(--sans);fill:var(--ink2);font-size:11px}
svg .ax{stroke:var(--rule);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 8px;border-radius:3px;z-index:20;max-width:260px}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink2);max-width:86ch}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:3px}

/* template pass: type, colour and spacing follow the supplied reference (large light grotesque headings, wide-spaced labels, deep navy panels,
   big figures with the label beneath, generous white space). Level 1 conclusion, level 2 key figures, level 3 interpretation, level 4 audit detail. */
:root{--bg:#ffffff;--surface:#ffffff;--ink:#14161c;--ink2:#4c515c;--muted:#8b909b;--rule:#e6e7ea;--rule2:#14161c;--sunk:#f3f4f6;--accent:#16264a;--accent-bg:#eef1f7;
  --navy1:#16264a;--navy2:#0a1230;--navy3:#070b1d;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"DM Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#090c16;--surface:#0f1320;--ink:#eceef2;--ink2:#b4b9c4;--muted:#7f8694;--rule:#232838;--rule2:#eceef2;--sunk:#161b2a;--accent:#a9c3f2;--accent-bg:#172138} }
:root[data-theme="dark"]{--bg:#090c16;--surface:#0f1320;--ink:#eceef2;--ink2:#b4b9c4;--muted:#7f8694;--rule:#232838;--rule2:#eceef2;--sunk:#161b2a;--accent:#a9c3f2;--accent-bg:#172138}
body{font-size:15px;line-height:1.55}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums}
.lab,h2{font-size:10.5px;letter-spacing:.3em;font-weight:500;color:var(--muted)}
h3{font-size:18px;font-weight:500;letter-spacing:-.01em}
main{max-width:1160px;padding-inline:36px;padding-block:24px 96px;gap:28px}
.view{gap:64px}
.blk{gap:16px} .blk>h2{border-top:0;padding-top:0} 
/* hero */
.hero{border-radius:18px;padding:30px 36px 8px;color:#d9dde6;background:radial-gradient(110% 150% at 88% -20%,#2f4d80 0%,rgba(47,77,128,0) 46%),linear-gradient(160deg,var(--navy1) 0%,var(--navy2) 58%,var(--navy3) 100%);display:flex;flex-direction:column;gap:6px}
.herotop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;align-items:baseline;margin-bottom:44px}
.hero .lab{color:#93a0bd} .hero .meta{font-size:13px;color:#aab3c8}
.hero h1{font-size:54px;font-weight:500;letter-spacing:-.03em;line-height:1.02;color:#e3e6ed}
.hero .sub{font-size:19px;color:#aab3c8;margin-bottom:22px}
.figs{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));border-top:1px solid rgba(255,255,255,.16);border-bottom:0;margin-top:6px}
.figs>div{padding:18px 16px 18px 0;gap:0;display:flex;flex-direction:column}
.figs b{font-family:var(--sans);font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1.1;color:#fff;order:1}
.figs .lab{order:2;letter-spacing:.02em;text-transform:none;font-size:14px;color:#c3cadb;font-weight:400}
.figs .s{order:3;font-size:12px;color:#8f9ab4}
.figs .q b{color:#aab3c8}
@media (max-width:700px){.hero{padding:22px 20px 4px}.hero h1{font-size:36px}.herotop{margin-bottom:24px}.figs b{font-size:30px}}
/* tab bar: one rounded bar, selected tab filled */
nav.tabs{border:1px solid var(--rule);border-radius:12px;padding:5px;gap:2px;background:var(--surface);position:sticky;top:8px;z-index:5}
nav.tabs button{border:0;margin:0;border-radius:8px;padding:8px 15px;color:var(--muted);font-weight:400;font-size:14.5px;transition:background .12s,color .12s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:500}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#0a1230}}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#0a1230}
.head{gap:6px} .head h1{font-size:44px;font-weight:500;letter-spacing:-.03em;color:var(--ink)} .head p{font-size:18px;color:var(--muted);max-width:60ch}
/* statements */
.counter{font-size:34px;line-height:1.16;font-weight:500;letter-spacing:-.025em;color:var(--ink);text-wrap:pretty;max-width:22em}
.counter.sm{font-size:22px;line-height:1.25}
.take{font-size:25px;line-height:1.22;font-weight:500;letter-spacing:-.02em;color:var(--ink);max-width:30em;text-wrap:pretty}
.lead2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:24px 56px;align-items:start}
@media (max-width:860px){.lead2{grid-template-columns:1fr}.counter{font-size:26px}.take{font-size:21px}}
.bview{display:flex;flex-direction:column;gap:10px} .bview p{font-size:18px;line-height:1.4;color:var(--muted)}
.prose{font-size:15px;color:var(--ink2)} .lede{font-size:19px;line-height:1.4;color:var(--ink2);max-width:46em}
.axes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px 40px}
.axis{gap:8px;border-top:1px solid var(--rule2);padding-top:14px}
.axis .q{font-size:12.5px;color:var(--muted)} .axis .a{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.axis .a::before{content:"";display:inline-block;width:9px;height:9px;margin-right:10px;vertical-align:2px;background:var(--neutral)}
.axis .a.good::before{background:var(--good);border-radius:50%} .axis .a.warn::before{background:var(--warn);transform:rotate(45deg)} .axis .a.bad::before{background:var(--bad)}
/* navy panel for the main figures */
.panel{--bg:#0c1430;--surface:#121b3a;--ink:#eef0f5;--ink2:#b9c1d4;--muted:#8591ad;--rule:#27325a;--rule2:#eef0f5;--sunk:#1a2548;--hist:#5b678a;--s1:#5aa2ff;--s2:#ff8a57;
  background:linear-gradient(160deg,#111c3d,#0a1230 70%);color:var(--ink);border-radius:16px;padding:22px 26px 18px;display:flex;flex-direction:column;gap:10px}
.panel .lab{color:#93a0bd} .panel .legend{color:var(--ink2)} .panel svg text{font-size:11.5px}
.panel .cap{font-size:12.5px;color:var(--muted)}
/* disagreements */
.dis{grid-template-columns:56px minmax(0,1fr);gap:4px 12px;padding:22px 0;border-bottom:1px solid var(--rule)}
.dis:first-child{border-top:1px solid var(--rule2)}
.dis .n{font-family:var(--sans);font-size:13px;color:var(--muted);padding-top:6px;letter-spacing:.1em}
.dis h3{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.dis .imp{color:var(--ink2);font-size:16px;margin:6px 0 4px;max-width:70ch}
.dis .vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 36px;margin:10px 0 6px}
.dis .vs p{color:var(--ink2);font-size:14.5px}
dl.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;margin:0} dl.kv dt{color:var(--muted);font-size:12.5px} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* disclosure */
details.more>summary{font-weight:400;font-size:14px;color:var(--muted);padding:10px 0;border-top:1px solid var(--rule)}
details.more>summary:hover{color:var(--ink)}
details.more.in{margin-top:4px} details.more.in>summary{border-top:0;padding:2px 0;color:var(--ink);font-size:13.5px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule)}
#val-controls details.more>summary,#d-ledger>summary{font-size:18px;font-weight:500;color:var(--ink);padding:14px 0}
/* buttons */

"tax":28,"g":5.0},"claims":[{"t":"Reported fact","v":"supported","q":"Novelis Q1 adjusted EBITDA $516 mn, up 24% year on year, on shipments of 916 kt and EBITDA per tonne of $563.","f":"Matches the Novelis release: $516 mn against $416 mn, 916 kt against 963 kt, $563 against $432 per tonne.","s":["nov"],"mat":3,"conf":"High","chg":"A restated Novelis filing.","p":0,"inf":{"v":"Overstated","t":"The figure is right. The note reads it as proof that earnings have turned, but the quarter was lifted by scrap spreads and insurance timing that the note itself calls temporary."}},{"t":"Reported fact","v":"supported","q":"Novelis net debt $7.9 bn; net debt to EBITDA 4.5x against 4.1x in March.","f":"Adjusted net debt $7,865 mn over trailing EBITDA $1,745 mn gives 4.51x. March was $6,724 mn over $1,645 mn. Net debt rose $1,141 mn in a single quarter.","s":["sec"],"c":"7,865 ÷ 1,745 = 4.51x      6,724 ÷ 1,645 = 4.09x","mat":3,"conf":"High","chg":"A restated Novelis filing.","p":1,"inf":{"v":"Does not follow","t":"The figure is right. Rising leverage is cited in a note headlined leverage to recede; the fact points the other way for now."}},{"t":"Reported fact","v":"supported","q":"Liquidity of $2.1 bn; Novelis net profit of $164 mn.","f":"Both match the release: $1.1 bn cash plus $1.0 bn committed facilities, and net income of $164 mn against $96 mn.","s":["nov"],"mat":1,"conf":"High","chg":"A restated Novelis filing."},{"t":"Analyst calculation","v":"inconsistent","q":"Excluding the $18 mn net Oswego benefit, underlying EBITDA per tonne was $525.","f":"On reported shipments the figure is $544. The note reaches $525 only if the 33 kt of lost Oswego volume is added to the denominator, a definition it does not state. The error is conservative, but a reader cannot reproduce the number.","s":["nov","note"],"c":"(516 − 18) ÷ 916 kt = $544/t      (516 − 18) ÷ (916 + 33) kt = $525/t","mat":2,"conf":"High","chg":"The note stating its definition of underlying EBITDA per tonne.","p":0},{"t":"Omission","v":"gap","q":"The note describes a net positive impact of $18 mn from the Oswego fires.","f":"That is the EBITDA line only. Below EBITDA, Novelis booked $265 mn of pre-tax net Oswego losses in the same quarter and $1,190 mn over the trailing twelve months. JM Financial called the previous quarter's beat largely optical for the same reason ($577 mn booked below EBITDA). The note mentions neither figure.","s":["sec","jm"],"mat":3,"conf":"High","chg":"The note disclosing the below-EBITDA Oswego losses alongside the EBITDA benefit.","p":0},{"t":"Forecast","v":"contradicted","q":"FY27E extraordinary items of Rs −14.5 bn for the full year.","f":"Two days after the note, Hindalco reported exceptional expenses of Rs 22.99 bn for Q1 alone, 1.6 times the note's full-year figure. The Novelis release, available on the day the note was written, already showed $265 mn.","s":["hq1","sec"],"c":"$265 mn × Rs 95.1 = Rs 25.2 bn in Q1 against Rs 14.5 bn modelled for FY27E","post":true,"mat":2,"conf":"High","chg":"Nothing: the reported Q1 figure already exceeds the full-year estimate."},{"t":"Forecast","v":"fragile","q":"Novelis leverage falls from 4.5x to below 4x by FY27-end.","f":"With net debt flat at $7,865 mn, the next three quarters must average $483 mn of EBITDA. The same three quarters of FY26 averaged about $410 mn. If net debt rises by the $500 mn term loan signed in July, the requirement is $525 mn a quarter, above the Q1 print that the note itself says should not be extrapolated.","s":["sec","note"],"c":"(7,865 ÷ 4.0 − 516) ÷ 3 = $483 mn      (8,365 ÷ 4.0 − 516) ÷ 3 = $525 mn","mat":4,"conf":"Medium","chg":"Novelis Q2 adjusted EBITDA of $525 mn or more, or net debt falling before Q4.","p":1},{"t":"Forecast","v":"unverifiable","q":"Novelis turns free-cash-flow positive by 4QFY27 as Bay Minette capex winds down.","f":"Management guidance with no public way to test it yet. Q1 adjusted free cash flow was −$1,134 mn on capex of $775 mn. The same team's Bay Minette budget went from $2.5 bn to $4.1 bn to about $5 bn, and start-up moved from mid-2025 to the second half of 2026.","s":["sec","bm1","mo"],"mat":3,"conf":"Medium","chg":"Novelis reporting positive adjusted free cash flow for Q4 FY27 in May 2027.","p":1},{"t":"Forecast","v":"unverifiable","q":"Management retains medium-term normalised EBITDA per tonne of about $600.","f":"Novelis earned $462 per tonne in FY26. The $563 in Q1 FY27 was helped by scrap spreads the note says will not last. Neither alternate broker models $600 inside its forecast period: JM Financial uses $509 and $519 for FY27E and FY28E, Motilal Oswal $531 for FY28E.","s":["iar","nov","jm","mo"],"mat":4,"conf":"Medium","chg":"Two consecutive quarters above $560 per tonne without help from scrap spreads or insurance.","p":0},{"t":"Forecast","v":"fragile","q":"Bay Minette: positive EBITDA in FY28, EBITDA per tonne above $1,000, total capital about $5 bn for 600 kt.","f":"At exactly those numbers the post-tax return on capital is about 6.5%. EBITDA per tonne near $1,280 is needed to earn 9%. North America, where the plant sits, earned $295 per tonne in Q1 ($111 mn on 376 kt). The note presents the project as a catalyst and never tests its return.","s":["note","sec","mo"],"c":"600 kt × $1,000 = $600 mn EBITDA; less $167 mn depreciation (30 years); × (1 − 25%) = $325 mn ÷ $5,000 mn = 6.5%","mat":3,"conf":"Medium","chg":"Disclosed Bay Minette contract pricing that supports about $1,280 per tonne, or a lower final budget.","p":2},{"t":"Analyst calculation","v":"inconsistent","q":"Headline: leverage to recede. Model: consolidated net debt FY26 Rs 818.5 bn, FY27E Rs 965.5 bn.","f":"In the note's own balance sheet, consolidated net debt rises 18% in FY27E and net debt to EBITDA is unchanged at 2.1x. The improvement appears only in FY28E. The FY27E figure is also above the Rs 800 to 900 bn peak that management guided to, as reported by JM Financial.","s":["note","jm"],"mat":3,"conf":"High","chg":"Hindalco reporting lower consolidated net debt at March 2027 than at March 2026.","p":1},{"t":"Valuation","v":"gap","q":"We maintain ADD and TP of Rs 1,150.","f":"No method, multiple, discount rate or sum-of-the-parts is given anywhere in the note. Both alternate brokers publish a full sum-of-the-parts. Working backwards, the target equals 7.2x FY28E EV/EBITDA on the note's own net debt.","s":["note","jm","mo"],"c":"(1,150 × 2,247.2 mn + Rs 965.5 bn) ÷ Rs 495.6 bn = 7.16x","mat":4,"conf":"High","chg":"The note publishing its sum-of-the-parts, multiples and net debt.","p":3},{"t":"Valuation","v":"inconsistent","q":"EV/EBITDA of 5.5x FY27E and 5.2x FY28E.","f":"Market cap of Rs 2,335 bn plus the note's FY27E net debt of Rs 965.5 bn is an EV of Rs 3,300 bn, or 7.1x FY27E and 6.6x FY28E. JM Financial prints 6.6x and Motilal Oswal 7.5x for FY28E. The note's table makes the stock look about 1.5 turns cheaper than its own balance sheet, and the rest of the street, supports.","s":["note","jm","mo"],"c":"(2,335 + 965.5) ÷ 466.6 = 7.07x printed as 5.5x","mat":4,"conf":"High","chg":"The note stating an EV definition that reconciles to its printed row.","p":3},{"t":"Valuation","v":"inconsistent","q":"P/E of 7.9x FY28E, shown beside adjusted EPS of Rs 105.2.","f":"The P/E row is computed on reported profit, and FY28E reported profit includes a Rs 57.7 bn one-off gain. On the adjusted EPS printed two lines above, the multiple is 9.9x.","s":["note"],"c":"1,039 ÷ 105.2 = 9.9x      1,039 ÷ (291,649 ÷ 2,225) = 7.9x","mat":2,"conf":"High","chg":"The note labelling the row as P/E on reported earnings.","p":3},{"t":"Forecast","v":"fragile","q":"Working capital days fall from 41.4 (FY26) to 28.5 in FY28E.","f":"That releases about Rs 102 bn and lifts FY28E operating cash flow to 89% of EBITDA. Hindalco's cash conversion cycle has not been below 36 days in any of the last twelve years on the Screener definition.","s":["note","scr"],"c":"(39.3 − 28.5) days × Rs 3,460.8 bn ÷ 365 = Rs 102 bn","mat":3,"conf":"Medium","chg":"Hindalco reporting a cash conversion cycle below 36 days for a full year.","p":1},{"t":"Omission","v":"gap","q":"Revenue growth of 23.3%, 2.1% and 17.1% for FY27E to FY29E.","f":"No aluminium price, premium, volume or currency assumption is disclosed, so the path cannot be tested. JM Financial states $3,250 per tonne LME and Rs 92 per dollar; the note states nothing.","s":["note","jm"],"mat":3,"conf":"High","chg":"The note disclosing its aluminium price, premium, volume and currency assumptions.","p":4},{"t":"Omission","v":"gap","q":"The note argues the case entirely through Novelis.","f":"India upstream aluminium earned Rs 73.9 bn of the Rs 149.9 bn consolidated Q1 EBITDA, at $2,331 per tonne and a 55% margin, with LME averaging $3,577. LME is now near $3,120 and the ten-year average to 2025 is $2,166. The note has no price sensitivity for the segment that produces half of group EBITDA.","s":["hq1","hsl","lme","lm2"],"c":"1.34 mt × $100 × 0.76 pass-through × Rs 95.1 = Rs 9.7 bn of EBITDA per $100/t","mat":4,"conf":"High","chg":"The note adding a sensitivity of group EBITDA to the aluminium price.","p":4},{"t":"Forecast","v":"overtaken","q":"FY27E consolidated EBITDA of Rs 466.6 bn.","f":"Hindalco reported Rs 149.9 bn for Q1, 32% of the full-year estimate. This cuts in the analyst's favour for FY27, provided aluminium holds. The FY29E figure of Rs 582 bn, which drives the valuation, is close to the Q1 run rate annualised (Rs 600 bn), so the long-run number assumes peak-like conditions persist.","s":["hq1"],"post":true,"mat":3,"conf":"High","chg":"Aluminium prices falling far enough for the remaining quarters to average 30% below Q1."},{"t":"Valuation","v":"supported","q":"ADD rating with 10.7% upside.","f":"Consistent with Emkay's own scale (ADD is 5% to 15%). The target has followed the price, though: Rs 1,050, 1,100, 1,200 and 1,150 as the stock traded at 884, 952, 1,109 and 970. At Rs 944 today the same target implies 21.8% upside, which on the same scale would be a BUY.","s":["note","av"],"mat":2,"conf":"High","chg":"Not applicable: the rating matches the broker's published scale.","p":3,"inf":{"v":"Holds","t":"The rating follows from the target. Whether the target is right is tested on the Valuation tab."}},{"t":"Analyst calculation","v":"inconsistent","q":"Shares outstanding 2,247.2 mn (stock data); EPS computed on 2,225 mn.","f":"A 1% difference that slightly overstates every per-share figure in the model. Motilal Oswal uses 2,247 mn. Minor, but it should be fixed before publication.","s":["note","mo"],"mat":1,"conf":"High","chg":"The note using one share count throughout."},{"t":"Omission","v":"gap","q":"Deleveraging is presented as a Novelis operating outcome.","f":"Hindalco put $950 mn of equity into Novelis in the second half of FY26, and Novelis debt still rose about $520 mn. Parent funding is part of how leverage is being managed. Both alternate brokers report it; the note does not.","s":["jm","mo"],"mat":3,"conf":"High","chg":"Not applicable: both alternate brokers report the infusion.","p":1},{"t":"Forecast","v":"unverifiable","q":"Net tariff headwind of about $70 mn should normalise toward zero; cost savings to reach $350 to $400 mn by FY28-end.","f":"Both are management statements relayed from the call. The release confirms higher net tariffs in the quarter but gives no figure. The savings target is repeated by both alternate brokers, again from management.","s":["sec","jm"],"mat":2,"conf":"Low","chg":"Novelis disclosing the tariff cost and the savings run rate in a filing.","p":0},{"t":"Macro input","v":"overtaken","q":"Nifty 24,625 and INR/USD 95.1 at the time of the note.","f":"Since then the 10-year G-sec has risen to 7.20%, a 2.5-year high, and Nifty is at 22,422. Hindalco has fallen 9.1% against 8.9% for the index, so the move is market-wide, but the discount rate any valuation should use is now higher.","s":["gsec","nif"],"post":true,"mat":2,"conf":"High","chg":"Not applicable: market dat   // ---- beta: rows [[YYYY-MM, index close, stock close]], uses the last 60 monthly returns available

/* ============================================================
   PERSISTENCE
   Reviews are kept in the browser (localStorage) and, when the page runs inside Claude, mirrored to the artifact's
   shared store so they follow the artifact. The sample review is built in and cannot be deleted.
   ============================================================ */
const STORE = (() => {
  const reports = {}; let sample = null, timer = null;
  const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

    if (ss) { sample.settings = ss.settings || {}; (ss.watch || []).forEach((s, i) => { if (sample.watch[i] && s) sample.watch[i].status = s; }); }
    reports[sample.id] = sample;
    const saved = ls.get(CONFIG.storageKey) || {}; for (const id in saved) { try { reports[id] = normalizeReport(saved[id]); } catch (e) {} }
  }
  async function loadRemote() {
    if (!CAP.db) return 0; let n = 0;
    try { const q = await CAP.db.collection(CONFIG.dbCollection).get(); for (const d of q.docs) { const a = d.data(); if (!a || !a.meta || !a.claims || a.id === sample.id) continue; const have = reports[a.id]; if (!have || String(a.reviewed || a.runAt || '') >= String(have.reviewed || '')) { if (!have) n++; reports[a.id] = normalizeReport(a); } } writeLocal(); } catch (e) {}
    return n;
  }
  async function save(R) {
    reports[R.id] = R; const local = writeLocal(); let remote = false;
    if (CAP.db && R.kind !== 'sample') { try { await CAP.db.collection(CONFIG.dbCollection).doc(R.id).set(clone(R)); remote = true; } catch (e) {} }
    return remote ? 'Saved to this artifact and this browser.' : local ? 'Saved in this browser.' : 'Could not be saved; it will be lost when the page closes.';
  }

    for (const [lab, f, unit, d] of [['EBITDA', e => e.e[1], ' bn', 0], ['EPS', e => e.eps[1], '', 1]]) { const have = sel.filter(e => f(e) != null && e.years && e.years[1] === ref.years[1]); if (have.length < 2) continue; const h = have.reduce((p, q) => f(q) > f(p) ? q : p), l = have.reduce((p, q) => f(q) < f(p) ? q : p), sp = (f(h) / f(l) - 1) * 100; (sp <= 5 ? agree : differ).push(`${ref.years[1]} ${lab}: Rs ${fmt(f(l), d)}${unit} (${l.label}) to Rs ${fmt(f(h), d)}${unit} (${h.label}), ${sp.toFixed(0)}% apart.`); }
    const nds = sel.filter(e => e.nd != null); if (nds.length >= 2) { const h = nds.reduce((p, q) => q.nd > p.nd ? q : p), l = nds.reduce((p, q) => q.nd < p.nd ? q : p), gap = h.nd - l.nd; (gap / h.nd <= 0.05 ? agree : differ).push(`Net debt deducted: Rs ${fmt(l.nd)} bn (${l.label}) to Rs ${fmt(h.nd)} bn (${h.label}), a gap of Rs ${fmt(gap)} bn or Rs ${fmt(gap * 1000 / R0.meta.sharesMn)} a share.`); }
    const disclosed = sel.filter(e => e.method && !/not disclosed|not stated/i.test(e.method)); if (disclosed.length !== sel.length) differ.push(`Method: ${sel.filter(e => !disclosed.includes(e)).map(e => e.label).join(', ')} ${sel.length - disclosed.length === 1 ? 'does' : 'do'} not disclose how the target is derived; ${disclosed.length ? disclosed.map(e => e.label).join(', ') + ' do.' : 'none do.'}`);
    out.push(blk('Where they agree and differ', [el('div', { class: 'cols' }, el('div', {}, el('h3', { text: 'Agree' }), agree.length ? el('ul', { class: 'tight' }, agree.map(t => el('li', { text: t }))) : el('p', { class: 'small muted', text: 'Nothing within 5% across the selected notes.' })), el('div', {}, el('h3', { text: 'Differ' }), differ.length ? el('ul', { class: 'tight' }, differ.map(t => el('li', { text: t }))) : el('p', { class: 'small muted', text: 'No difference above 5%.' }))), el('p', { class: 'prose', text: `Most optimistic: ${hi.label}, ${rs(hi.target)}. Most pessimistic: ${lo.label}, ${rs(lo.target)}.${A[0] && A[0].desk.target ? ` The desk value is ${rs(A[0].desk.target)}, ${A[0].desk.target < lo.target ? 'below all of them' : A[0].desk.target > hi.target ? 'above all of them' : 'inside the range'}.` : ''}` })]));
    out.push(blk('Forecasts', tbl(cols, [row('EBITDA ' + (ref.years[0] || ''), e => e.e[0] != null ? `Rs ${fmt(e.e[0])} bn` : null), row('EBITDA ' + (ref.years[1] || ''), e => e.e[1] != null ? `Rs ${fmt(e.e[1])} bn` : null), row('EPS ' + (ref.years[0] || ''), e => e.eps[0] != null ? rs(e.eps[0], 1) : null), row('EPS ' + (ref.years[1] || ''), e => e.eps[1] != null ? rs(e.eps[1], 1) : null), row('Net debt used', e => e.nd != null ? `Rs ${fmt(e.nd)} bn` : null), row('Stated assumptions', e => e.assume || 'Not stated')])));
    out.push(blk('Which assumption explains the target gap', [bridgeTable(ref, sel.slice(1), meth, R0), el('p', { class: 'small muted', text: `${ref.label} is the reference because it was selected first. A positive figure means the other note is higher. Split on ${ENGINE.METHOD[meth]} using each note's own ${ref.years[1] || 'forward'} estimate; the parts add up to the gap.` }), row && tbl(cols, [row('Method', e => e.method), row('Printed EV/EBITDA ' + (ref.years[1] || ''), e => e.evPrinted != null ? mx(e.evPrinted) : null)])]));
  } else {
    out.push(blk('Where they agree and differ', [agree.concat(differ).length ? el('ul', { class: 'tight' }, agree.concat(differ).map(t => el('li', { text: t }))) : null, el('p', { class: 'prose', text: 'These notes cover different companies, so forecasts and targets are not set against each other. The comparison below is of research quality: how each thesis stands up.' })]));
  }
  // review-level comparison
  const rev = sel.map((e, i) => [e, A[i]]).filter(([e, a]) => e.subject && a);
  if (rev.length) {
    out.push(blk('Quality of the research', [tbl(['Diagnostic'].concat(rev.map(([e]) => [e.label + (same ? '' : ', ' + (e.R.meta.short || e.company))])), ENGINE.COMPONENTS.map(c => [td(c.name)].concat(rev.map(([e, a]) => { const p = a.score.parts.find(x => x.key === c.key); return tdr(p.pct == null ? GAP.ins : Math.round(p.pct * 100) + '%'); }))).concat([{ cls: 'tot', cells: [td('Score')].concat(rev.map(([e, a]) => tdr(a.score.total == null ? 'Pending' : String(a.score.total)))) }])), rev.length < sel.length ? el('p', { class: 'small muted', text: 'Captured notes have not been through the claim ledger, so they have no diagnostics. Run a review on one to add it here.' }) : null]));
    out.push(blk('Thesis, pillar by pillar', rev.map(([e]) => el('div', {}, el('h3', { text: `${e.label}: ${e.R.thesis || 'thesis not recorded'}` }), e.R.pillars.length ? tbl(['Pillar', 'Broker view', 'Desk verdict'], e.R.pillars.map(p => [td(null, null, el('b', { text: p.name })), td(p.a, 'ink2'), td(null, null, tag(PILLAR_TONE[p.v] || 'neutral', p.v))])) : el('p', { class: 'small muted', text: 'No pillars recorded.' })))));
    out.push(blk('Risks and evidence', tbl(['', 'Material evidence not addressed', 'Claims contradicted or not reconciling', 'What would break the thesis'], rev.map(([e]) => { const R = e.R, miss = R.news.filter(n => n.an === 'Not considered' && n.m >= 2), bad = R.claims.filter(c => ['contradicted', 'inconsistent'].includes(c.v) && c.mat >= 3);
      return [td(null, null, el('b', { text: e.label })), td(miss.length ? `${miss.length}: ${miss.slice(0, 2).map(n => n.h).join('; ')}` : 'None found', 'ink2'), td(bad.length ? `${bad.length}: ${bad.slice(0, 2).map(c => c.q).join('; ')}` : 'None', 'ink2'), td(R.watch.length ? R.watch.slice(0, 2).map(w => `${w.metric} ${w.fails}`).join('; ') : 'Not recorded', 'ink2')]; }))));
    out.push(blk('Desk conclusion', rev.map(([e, a]) => el('div', {}, el('h3', { text: `${e.label}, ${e.company}` }), el('p', { class: 'prose', text: e.R.status === 'Draft' ? 'Draft. The AI review has not completed, so there is no conclusion yet.' : `${a.score.verdict}. ${e.R.counter || ''}` }), el('button', { class: 'btn q', text: 'Open this review', on: { click: () => UI.open(e.R.id) } })))));
  }
  const cap = sel.filter(e => !e.subject);
  if (cap.length) out.push(el('p', { class: 'small muted', text: `${cap.map(e => e.label).join(', ')}: captured from public broker coverage while reviewing another note. Figures are as published; the thesis has not been tested.` }));
  return out;
}

/* ============================================================
   EVENT HANDLERS and navigation
   ============================================================ */
const UI = {
  render() {
    renderRail(); const main = $('main'), keep = STATE.view + '|' + STATE.id + '|' + STATE.tab, y = UI._last === keep ? scrollY : 0; UI._last = keep; let kids;
    try {
      if (STATE.view === 'library') kids = viewLibrary(); else if (STATE.view === 'new') kids = viewNew(); else if (STATE.view === 'compare') kids = viewCompare(); else if (STATE.view === 'alerts') kids = viewAlerts();
      else { let R = STORE.get(STATE.id); if (!R) { STATE.id = STORE.sampleId(); R = STORE.get(STATE.id); } if (!VIEWS[STATE.tab]) STATE.tab = 'summary'; const a = analyse(R); loadQuote(R); checkFresh(R); kids = reportHead(R, a).concat([el('div', { class: 'view', role: 'tabpanel', 'aria-labelledby': 'tab-' + STATE.tab }, VIEWS[STATE.tab](R, a))]); }
    } catch (e) { kids = [el('div', { class: 'notice err', role: 'alert' }, el('b', { text: 'This view could not be drawn' }), el('span', { class: 'ink2', text: 'The saved review is missing something this screen needs. Other tabs and reviews are unaffected.' }), el('span', { class: 'small muted', text: String(e && e.message || e) }), el('div', {}, el('button', { class: 'btn q', text: 'All reviews', on: { click: () => UI.go('library') } })))]; }
    main.replaceChildren(...kids.flat().filter(Boolean)); tipEl().hidden = true; scrollTo(0, y);
    const h = STATE.view === 'report' ? `report/${STATE.id}/${STATE.tab}` : STATE.view; if (location.hash.slice(1) !== h) { try { history.replaceState(null, '', '#' + h); } catch (e) {} }
  },
  go(view) { STATE.view = view; STATE.pendingDelete = null; UI.render(); $('main').focus({ preventScroll: true }); },
  open(id, tab) { STATE.view = 'report'; STATE.id = id; STATE.tab = tab || 'summary'; STATE.claims = { v: 'all', t: 'all', mat: 0, p: 'all' }; UI.render(); },
  tab(id) { STATE.tab = id; UI.render(); const b = $('tab-' + id); if (b) b.focus({ preventScroll: true }); },
  claims(f) { STATE.claims = { v: 'all', t: 'all', mat: 0, p: 'all', ...f }; UI.tab('claims'); },
  compareCompany(k) { STATE.cmp = companyEntries(k).map(e => e.key); STATE.view = 'compare'; STATE.pendingDelete = null; UI.render(); scrollTo(0, 0); },
  async remove(id) { STATE.pendingDelete = null; STATE.cmp = STATE.cmp.filter(k => !k.startsWith(id)); await STORE.remove(id); if (STATE.id === id) { STATE.id = STORE.sampleId(); if (STATE.view === 'report') STATE.tab = 'summary'; } UI.render(); },
  fresh() { const n = $('fresh'), R = STATE.view === 'report' && STORE.get(STATE.id); if (n && R) n.replaceWith(freshStrip(R)); },
  quote() { const n = $('quote'), R = STATE.view === 'report' && STORE.get(STATE.id); if (n && R) n.replaceWith(quoteChip(R)); },
  toggleCmp(key) { STATE.cmp = STATE.cmp.includes(key) ? STATE.cmp.filter(k => k !== key) : STATE.cmp.concat(key); UI.render(); },
  progress() { const s = $('steps'); if (s) s.replaceWith(stepsList()); const l = $('runlog'); if (l) l.textContent = RUN.log.join('\n'); },
  valuationChanged(R) { if (STATE.view !== 'report' || STATE.tab !== 'valuation' || STATE.id !== R.id) return; const box = $('val-results'); const an = analyse(R); if (box) box.replaceChildren(...valuationResults(R, an).flat().filter(Boolean)); const hf = $('hero-figs'); if (hf) hf.replaceWith(figures(R, an)); renderRail(); },
  async pick(k, file) {
    if (!file) return; RUN.error = null;
    try { const text = await readFile(file); if (text.replace(/\s/g, '').length < 400) throw { code: 'no_text' }; RUN.files[k] = { name: file.name, text }; }
    catch (e) { RUN.error = e && e.code === 'pdf_reader' ? describeError(e, 'read', null) : { title: 'That file could not be read', body: `${file.name} has no readable text. Scanned PDFs are images; paste the text of the note instead.`, code: 'no_text', canRetry: false }; STATE.paste = true; }
    if (STATE.view !== 'new') STATE.view = 'new'; UI.render();
  },
};
function bindStatic() {
  $('nav-new').addEventListener('click', () => UI.go('new')); $('nav-library').addEventListener('click', () => UI.go('library')); $('nav-compare').addEventListener('click', () => UI.go('compare')); $('nav-alerts').addEventListener('click', () => UI.go('alerts'));
  for (const k of ['main', 'a1', 'a2']) $('f-' + k).addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; UI.pick(k, f); });
  document.addEventListener('keydown', e => { if (!['ArrowLeft', 'ArrowRight'].includes(e.key) || !e.target.matches('nav.tabs button')) return; const i = TABS.findIndex(t => t[0] === STATE.tab), n = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length; UI.tab(TABS[n][0]); });
  addEventListener('hashchange', () => { if (readHash()) UI.render(); });
}
function readHash() {

  if (['library', 'new', 'compare', 'alerts'].includes(p[0])) { const ch = STATE.view !== p[0]; STATE.view = p[0]; return ch; }
  return false;
}

/* ============================================================
   INITIALISATION
   ============================================================ */
(async function start() {
  STORE.init(); ALERTS.load(); try { const sa = JSON.parse(localStorage.getItem(ALERTS.key + '.sample') || 'null'); if (sa) STORE.get(STORE.sampleId()).alert = sa; } catch (e) {}
  STATE.id = STORE.sampleId(); const mine = STORE.all().find(r => r.kind !== 'sample'); if (mine) STATE.id = mine.id;
  $('main').tabIndex = -1; bindStatic(); readHash(); UI.render();
  await initCapabilities(); await ALERTS.loadRemote(); const added = await STORE.loadRemote(); if (added && STATE.view === 'report' && STATE.id === STORE.sampleId()) { const m = STORE.all().find(r => r.kind !== 'sample'); if (m && !location.hash.includes('report/')) STATE.id = m.id; }
  UI.render();
})();
